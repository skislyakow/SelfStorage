{% extends "base.html" %}
{% load static %}

{% block title %}Сброс пароля — SelfStorage{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="mb-4">Сброс пароля</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Отправить</button>
    </form>
    <p class="mt-3"><a href="{% url 'users:login' %}">Войти</a></p>
  </div>
</div>
{% endblock %}
