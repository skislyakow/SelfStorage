{% extends "base.html" %}
{% load static %}

{% block title %}Вход — SelfStorage{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="mx-auto" style="max-width: 600px">
    <h1 class="mb-4 fw-bold">Вход</h1>
    <form method="post" novalidate>{% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label SelfStorage_grey">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
      {% endfor %}
      <button type="submit" class="btn border-8 py-3 px-5 text-white fs_24 SelfStorage__bg_orange SelfStorage__btn2_orange">Войти</button>
    </form>
    <p class="mt-3 SelfStorage_grey">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a></p>
  </div>
</div>
{% endblock %}
