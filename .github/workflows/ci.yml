name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ci-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --frozen
      - name: Check migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: uv run python manage.py test