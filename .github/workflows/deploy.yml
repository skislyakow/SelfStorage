name: Deploy to VPS

# Деплой только после успешного CI: на push в main он не запускается сам,
# а ждёт завершения workflow CI с conclusion == success.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Параллельные деплои не накладываются: новый ждёт предыдущий,
# но и не отменяет уже начатый (cancel-in-progress: false).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Штатный прогон CI после push в main; падение CI или PR-прогон — не деплоим.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          ssh_strict: false
          script_stop: true
          script: |
            cd /opt/selftorage
            git pull
            bash /opt/selftorage/deploy.sh
