[project]
name = "selfstorage"
version = "0.1.0"
description = "SelfStorage — сервис аренды складских боксов"
authors = [
    { name = "Sergey Kislyakov", email = "s.kislyakov84@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django==5.2.17",
    "django-environ==0.14.0",
    "django-formtools==2.7",
    "gunicorn==26.2.0",
    "pillow==12.3.0",
    "qrcode[pil]==8.2",
    "yookassa==3.12.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]
[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "RUF",
]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = [
  "E501",
  "RUF012",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
