{% extends "base.html" %}
{% load static %}

{% block title %}Вход — SelfStorage{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="mb-4">Вход</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>
    <p class="mt-3">Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрируйтесь</a></p>
  </div>
</div>
{% endblock %}
